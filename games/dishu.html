<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            color: white;
            font-size: 1.3em;
        }

        .game-info div {
            background: rgba(255,255,255,0.2);
            padding: 10px 25px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .hole {
            width: 120px;
            height: 120px;
            background: #8B4513;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .hole:hover {
            transform: scale(1.05);
        }

        .mole {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 90px;
            background: linear-gradient(180deg, #D2691E 0%, #8B4513 100%);
            border-radius: 50% 50% 10% 10%;
            transition: bottom 0.3s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mole::before {
            content: '';
            position: absolute;
            top: 20px;
            width: 50px;
            height: 30px;
            background: #DEB887;
            border-radius: 50%;
        }

        .mole::after {
            content: '👀';
            position: absolute;
            top: 25px;
            font-size: 24px;
        }

        .mole.up {
            bottom: 15px;
        }

        .mole.hit {
            background: linear-gradient(180deg, #FF6B6B 0%, #C92A2A 100%);
            animation: hitAnimation 0.3s ease-in-out;
        }

        @keyframes hitAnimation {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(0.9); }
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(10px);
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .message {
            margin-top: 20px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            min-height: 40px;
        }

        .difficulty {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .difficulty label {
            color: white;
            font-size: 1.2em;
        }

        .difficulty select {
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 25px;
            border: none;
            background: rgba(255,255,255,0.9);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🎮 打地鼠游戏</h1>
    
    <div class="difficulty">
        <label for="difficulty">难度:</label>
        <select id="difficulty">
            <option value="1500">简单</option>
            <option value="1000" selected>中等</option>
            <option value="600">困难</option>
        </select>
    </div>

    <div class="game-info">
        <div>得分: <span id="score">0</span></div>
        <div>时间: <span id="time">30</span>s</div>
    </div>

    <div class="game-board">
        <div class="hole" data-index="0"><div class="mole"></div></div>
        <div class="hole" data-index="1"><div class="mole"></div></div>
        <div class="hole" data-index="2"><div class="mole"></div></div>
        <div class="hole" data-index="3"><div class="mole"></div></div>
        <div class="hole" data-index="4"><div class="mole"></div></div>
        <div class="hole" data-index="5"><div class="mole"></div></div>
        <div class="hole" data-index="6"><div class="mole"></div></div>
        <div class="hole" data-index="7"><div class="mole"></div></div>
        <div class="hole" data-index="8"><div class="mole"></div></div>
    </div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button class="btn-start" id="startBtn" onclick="startGame()">开始游戏</button>
        <button class="btn-back" onclick="window.location.href='index.html'">返回主页</button>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let moleTimer = null;
        let countdownTimer = null;
        let currentMoles = [];
        let audioContext = null;

        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const message = document.getElementById('message');
        const difficultySelect = document.getElementById('difficulty');

        // 初始化音频上下文
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 播放趣味音效
        function playHitSound() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // 创建有趣的音效序列
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
            oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
            oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function randomHole(excludeHoles = []) {
            const availableHoles = Array.from(holes).filter((_, index) => !excludeHoles.includes(index));
            if (availableHoles.length === 0) return null;
            const idx = Math.floor(Math.random() * availableHoles.length);
            return availableHoles[idx];
        }

        function getMolesCount() {
            // 游戏进行了多少秒 = 30 - timeLeft
            const elapsed = 30 - timeLeft;
            if (elapsed >= 20) {  // 20 秒后（剩余 10 秒或更少）
                return 3;
            } else if (elapsed >= 10) {  // 10 秒后（剩余 20 秒或更少）
                return 2;
            }
            return 1;
        }

        function peep() {
            if (!gameActive) return;

            const speed = parseInt(difficultySelect.value);
            const molesCount = getMolesCount();
            
            // 清除之前的地鼠
            currentMoles.forEach(mole => {
                if (mole && mole.classList.contains('up')) {
                    mole.classList.remove('up');
                }
            });
            currentMoles = [];

            // 创建指定数量的地鼠
            const usedIndices = [];
            for (let i = 0; i < molesCount; i++) {
                const hole = randomHole(usedIndices);
                if (!hole) continue;
                
                const mole = hole.querySelector('.mole');
                const holeIndex = Array.from(holes).indexOf(hole);
                usedIndices.push(holeIndex);
                
                mole.classList.add('up');
                currentMoles.push(mole);
            }

            setTimeout(() => {
                if (gameActive) {
                    currentMoles.forEach(mole => {
                        if (mole && mole.classList.contains('up')) {
                            mole.classList.remove('up');
                        }
                    });
                    currentMoles = [];
                }
            }, speed * 0.6);

            moleTimer = setTimeout(peep, speed);
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            
            // 初始化音频
            initAudio();
            
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            message.textContent = '';
            startBtn.disabled = true;
            difficultySelect.disabled = true;

            moles.forEach(mole => {
                mole.classList.remove('up', 'hit');
            });
            currentMoles = [];

            peep();

            countdownTimer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(countdownTimer);
            clearTimeout(moleTimer);
            
            currentMoles.forEach(mole => {
                if (mole) {
                    mole.classList.remove('up');
                }
            });
            currentMoles = [];

            startBtn.disabled = false;
            difficultySelect.disabled = false;
            
            let resultMessage = `游戏结束！你的得分是：${score}`;
            if (score >= 20) {
                resultMessage += ' 🏆 太棒了！';
            } else if (score >= 10) {
                resultMessage += ' 👍 不错哦！';
            } else {
                resultMessage += ' 💪 继续加油！';
            }
            message.textContent = resultMessage;
        }

        function bonk(e) {
            if (!gameActive) return;
            
            const mole = e.target.closest('.mole');
            if (!mole || !mole.classList.contains('up')) return;

            // 播放音效
            playHitSound();
            
            mole.classList.add('hit');
            mole.classList.remove('up');
            
            // 从当前地鼠列表中移除
            const index = currentMoles.indexOf(mole);
            if (index > -1) {
                currentMoles.splice(index, 1);
            }
            
            score++;
            scoreDisplay.textContent = score;

            setTimeout(() => {
                mole.classList.remove('hit');
            }, 300);
        }

        holes.forEach(hole => {
            hole.addEventListener('click', bonk);
        });
    </script>
</body>
</html>
